name: invoice_generator
description: "Modern offline invoice generator — Android, iOS & Web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  http: ^1.6.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  # PDF generation + preview/print/save/share — all platforms
  pdf: ^3.12.0
  printing: ^5.14.3
  image_picker: ^1.2.3
  package_info_plus: ^10.2.1
  upgrader: ^13.5.0
  open_file: ^4.0.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.34.5
  build_runner: ^2.15.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpeg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/